version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mysql-db-usuarios
    environment:
      MYSQL_ROOT_PASSWORD: coti
      MYSQL_DATABASE: db-usuarios
      MYSQL_ROOT_HOST: '%'
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - api-usuarios-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pcoti"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin-api-usuarios
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: coti
      PMA_DATABASE: db-usuarios
    ports:
      - "5052:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - api-usuarios-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  mysql_data:
    driver: local

networks:
  api-usuarios-network:
    driver: bridge
